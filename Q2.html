<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4a - Question 2</title>
</head>
<body>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button onclick="checkInput()">Check</button>

    <script>
        // Validate input and compare the entered number with 10
        function checkInput() {
            let input = document.getElementById("userInput").value.trim();

            if (input === "" || isNaN(input)) {
                alert("Please insert a number!");
            } else {
                let num = Number(input);

                if (num < 10) {
                    alert("The number is lower than 10");
                } else {
                    alert("The number is higher than 10");
                }
            }
        }
    </script>
</body>
</html>
